services:
  postgres:
    image: postgres:17-alpine
    container_name: korp-postgres
    environment:
      POSTGRES_USER: korp
      POSTGRES_PASSWORD: korp123
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - korp-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U korp -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  korp-postgres-data:
