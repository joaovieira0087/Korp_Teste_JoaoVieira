<div class="cabecalho">
  <h2>Produtos</h2>
  <button mat-flat-button color="primary" (click)="abrirFormulario()">
    <mat-icon>add</mat-icon>
    Novo produto
  </button>
</div>

<mat-form-field appearance="outline" class="campo-filtro">
  <mat-label>Buscar por código ou descrição</mat-label>
  <input matInput [formControl]="filtro" placeholder="ex.: parafuso">
  <mat-icon matSuffix>search</mat-icon>
</mat-form-field>

@if (carregando()) {
<mat-progress-bar mode="indeterminate" />
}

<table mat-table [dataSource]="produtos()" class="tabela">

  <ng-container matColumnDef="codigo">
    <th mat-header-cell *matHeaderCellDef>Código</th>
    <td mat-cell *matCellDef="let produto">{{ produto.codigo }}</td>
  </ng-container>

  <ng-container matColumnDef="descricao">
    <th mat-header-cell *matHeaderCellDef>Descrição</th>
    <td mat-cell *matCellDef="let produto">{{ produto.descricao }}</td>
  </ng-container>

  <ng-container matColumnDef="saldo">
    <th mat-header-cell *matHeaderCellDef class="alinhado-direita">Saldo</th>
    <td mat-cell *matCellDef="let produto" class="alinhado-direita">
      <span [class.saldo-zerado]="produto.saldo === 0">{{ produto.saldo }}</span>
    </td>
  </ng-container>

  <ng-container matColumnDef="acoes">
    <th mat-header-cell *matHeaderCellDef class="alinhado-direita">Ações</th>
    <td mat-cell *matCellDef="let produto" class="alinhado-direita">
      <button mat-icon-button (click)="abrirFormulario(produto)" aria-label="Editar">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button (click)="excluir(produto)" aria-label="Excluir">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="colunas"></tr>
  <tr mat-row *matRowDef="let linha; columns: colunas;"></tr>
</table>

@if (!carregando() && produtos().length === 0) {
<p class="vazio">Nenhum produto encontrado.</p>
}
